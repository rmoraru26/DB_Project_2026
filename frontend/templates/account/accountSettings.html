{% extends "layout.html" %}

{% block title %}
    Account Settings
{% endblock %}

{% block body %}
    <div class="mb-4">
        <h1 class="mb-4">Account Settings</h1>
        <span class="badge bg-light text-secondary border fw-normal fs-6 px-3 py-2">
            &#9993; {{ user[1] }}
        </span>
    </div>

    <!-- Messages -->
    {% if message %}
        <div class="alert alert-success rounded-3 mb-4">{{ message }}</div>
    {% endif %}
    {% if error %}
        <div class="alert alert-danger rounded-3 mb-4">{{ error }}</div>
    {% endif %}

    <div class="row g-4 align-items-start">

        <!-- Change Name Card -->
        <div class="col-12 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
                <div class="card-body p-0">
                    <h2 class="h4 fw-bold text-dark mb-3">Change Name</h2>
                    
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <input type="hidden" name="action" value="name">
                        
                        <div class="mb-3">
                            <label for="full_name" class="form-label fw-semibold text-secondary small mb-1">Full Name</label>
                            <input type="text" id="full_name" name="full_name" class="form-control" value="{{ user[0] }}" required>
                        </div>
                        
                        <button type="submit" class="btn custom-brand-btn">Save Name</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Change Password Card -->
        <div class="col-12 col-lg-7">
            <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
                <div class="card-body p-0">
                    <h2 class="h4 fw-bold text-dark mb-3">Change Password</h2>
                    
                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <input type="hidden" name="action" value="password">
                        
                        <div class="mb-3">
                            <label for="current_password" class="form-label fw-semibold text-secondary small mb-1">Current Password</label>
                            <input type="password" id="current_password" name="current_password" class="form-control" placeholder="Enter current password" required>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-12 col-md-6">
                                <label for="new_password" class="form-label fw-semibold text-secondary small mb-1">New Password</label>
                                <input type="password" id="new_password" name="new_password" class="form-control" placeholder="Minimum 8 characters" minlength="8" required>
                            </div>
                            <div class="col-12 col-md-6">
                                <label for="confirm_password" class="form-label fw-semibold text-secondary small mb-1">Confirm New Password</label>
                                <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-enter new password" minlength="8" required>
                            </div>
                        </div>
                        
                        <button type="submit" class="btn custom-brand-btn">Save Password</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
