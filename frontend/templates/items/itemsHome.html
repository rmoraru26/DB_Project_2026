{% extends "layout.html" %}

{% block title %}
    Items
{% endblock %}

{% block body %}
    <h1>Book an Item</h1>

    <!-- Item Categories -->
    {% for category, items_list in inventory.items() %}
        <details>
            <summary>{{ category }}</summary>
            <ul>
                {% for item in items_list %}
                    <li>
                        <a href="/items/{{ item }}">{{ item }}</a>
                    </li>
                {% endfor %}
            </ul>
        </details>
    {% endfor %}

    <!-- Back to Homepage -->
    <div>
        <a href="{{ url_for('index') }}" class="btn btn-secondary">Back</a>
    </div>

{% endblock %}
