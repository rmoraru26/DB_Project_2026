{% extends "layout.html" %}

{% block title %}
    Items
{% endblock %}

{% block body %}
    <h1 class="mb-4">Book an Item... or Multiple</h1>

    <div class="row row-cols-1 row-cols-md-4 g-4">

        {% for category, items_list in inventory.items() %}
            <div class="col">
                <div class="card">
                    
                    <img src="{{ url_for('static', filename='images/' ~ category|lower|replace(' ', '_') ~ '.jpg') }}" class="card-img-top" alt="{{ category }} image">

                    <div class="card-body">
                        <h4 class="card-title">{{ category }}</h4>
                    </div>

                    <ul class="list-group list-group-flush">
                        {% for item in items_list %}
                            <li class="list-group-item">
                                <a href="/items/{{ item }}">{{ item }}</a>
                            </li>
                        {% endfor %}
                    </ul>
        
                </div>
            </div>
        {% endfor %}

    </div>

{% endblock %}
