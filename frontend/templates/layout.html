<!DOCTYPE html>

<html lang="en">

    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

        <title> 
            {% block title %}{% endblock %} 
        </title>

        {% block head %}{% endblock %}
    </head>

    <body>
        <!-- Navigation Bar -->
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                
                <!-- Left-Aligned Links -->
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>

                    {% if session.get("user_id") %}
                        <li class="nav-item"><a class="nav-link" href="/itemsHome">Items</a></li>
                        <li class="nav-item"><a class="nav-link" href="/roomsHome">Rooms</a></li>
                    {% else %}
                        <li class="nav-item"><a class="nav-link disabled" aria-disabled="true">Items</a></li>
                        <li class="nav-item"><a class="nav-link disabled" aria-disabled="true">Rooms</a></li>
                    {% endif %}
                </ul>

                <!-- Right-Aligned Links -->
                 <ul class="navbar-nav ms-auto">
                    {% if session.get("user_id") %}
                        <li class="nav-item">
                            <a class="nav-link" href="/profile">
                                <span class="chip">
                                <span class="chip-icon">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                                    <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/>
                                    </svg>
                                </span>
                                Profile
                                </span>                    
                            </a>
                        </li>
                    {% else %}
                        <li class="nav-item"><a class="nav-link" href="/login">Login</a></li>
                        <li class="nav-item"><a class="nav-link" href="/register">Register</a></li>
                    {% endif %}
                 </ul>

            </div>
        </nav>

        <!-- Main Content -->
        <div class="container mt-4 mb-5">
            {% block body %}{% endblock %}
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    </body>

</html>
