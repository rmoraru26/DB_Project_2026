{% extends "layout.html" %}

{% block body %}
    <h1 class="mb-4">Register</h1>

    {% if error %}
        <div class="alert alert-danger" role="alert">
            {{ error }}
        </div>
    {% endif %}

    <form action="/register" method="post">
        <div><input autocomplete="off" placeholder="Full Name" type="text" name="full_name"></div>
        <div><input autocomplete="off" placeholder="Email" type="email" name="email"></div>
        <div><input autocomplete="off" placeholder="Password" type="password" name="password"></div>
        <div><input autocomplete="off" placeholder="Confirm Password" type="password" name="confirm_password"></div>
        <button type="submit">Register</button>
    </form>

{% endblock %}
