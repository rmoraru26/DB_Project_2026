{% extends "layout.html" %}

{% block title %}
    Login
{% endblock %}

{% block body %}
    <h1 class="mb-4">Login</h1>

    {% if error %}
        <div class="alert alert-danger" role="alert">
            {{ error }}
        </div>
    {% endif %}

    <form action="/login" method="post">
        <div><input autocomplete="off" placeholder="Email" type="email" name="email"></div>
        <div><input autocomplete="off" placeholder="Password" type="password" name="password"></div>
        <button type="submit">Login</button>
    </form>

{% endblock %}
