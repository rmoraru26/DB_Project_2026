{% extends "layout.html" %}

{% block title %}
    Login
{% endblock %}

{% block body %}

    <div class="form-container shadow-sm rounded-4 bg-white">
        <h1 class="text-center mb-3">Login</h1>

        {% if error %}
            <div class="alert alert-danger" role="alert">
                {{ error }}
            </div>
        {% endif %}

        <form action="{{ url_for('login', next='lab') if request.args.get('next') == 'lab' else url_for('login') }}" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <input autocomplete="off" placeholder="Email" type="email" class="form-control form-control-lg" name="email" id="login-email" aria-label="Email">
            </div>
            <div class="mb-3">
                <input autocomplete="off" placeholder="Password" type="password" class="form-control form-control-lg" name="password" id="login-password" aria-label="Password">
            </div>

            <div class="text-center mt-4">
                <button class="btn btn-lg custom-brand-btn" type="submit">Login</button>
            </div>
        </form>

        <div class="text-center mt-4">
            <a href="/register">Create a new account</a>
        </div>
    </div>

{% endblock %}
