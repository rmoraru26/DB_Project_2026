{% extends "layout.html" %}

{% block title %}
    Login
{% endblock %}

{% block body %}

    <div class="form-container">
        <h1 class="text-center mb-4">Login</h1>

        {% if error %}
            <div class="alert alert-danger" role="alert">
                {{ error }}
            </div>
        {% endif %}

        <form action="/login" method="post">
            <div class="mb-3">
                <input autocomplete="off" placeholder="Email" type="email" class="form-control form-control-lg" name="email">
            </div>
            <div class="mb-3">
                <input autocomplete="off" placeholder="Password" type="password" class="form-control form-control-lg" name="password">
            </div>

            <div class="text-center mt-4">
                <button class="btn btn-lg custom-brand-btn" type="submit">Login</button>
            </div>
        </form>

        <div class="text-center mt-4">
            <a href="/register">Create a new account</a>
        </div>
    </div>

{% endblock %}
