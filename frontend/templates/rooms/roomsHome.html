{% extends "layout.html" %}

{% block title %}
    Rooms
{% endblock %}

{% block body %}
    <h1>Book a Room</h1>

    <div>
        {% for room in rooms %}
            <a href="/rooms/{{ room }}" class="btn btn-lg custom-brand-btn">{{ room }}</a>
        {% endfor %}
    </div>

    <div>
        <a href="{{ url_for('index') }}" class="btn btn-secondary">Back</a>
    </div>

{% endblock %}
