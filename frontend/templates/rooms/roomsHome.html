{% extends "layout.html" %}

{% block title %}
    Rooms
{% endblock %}

{% block body %}
    <div class="contains-inline">
        <ol class="stepper sm:stepper-horizontal">
            <li class="stepper-item active">Choose Room</li>
            <li class="stepper-item">Select Booking Date</li>
            <li class="stepper-item">Confirm Booking Date</li>
        </ol>
    </div>
    
    <h1 class="mb-3">Book a Room... or Multiple</h1>

    <div class="row row-cols-1 row-cols-md-3 g-4">
        {% for room in rooms %}
            <div class="col">
                <div class="card">

                    <img src="{{ url_for('static', filename='images/' ~ room|lower|replace(' ', '_') ~ '.jpg') }}" class="card-img-top" alt="{{ room }} image">

                    <div class="card-body">
                        <h4 class="card-title">{{ room }}</h4>
                    </div>

                    <a href="/rooms/{{ room }}" class="btn btn-lg custom-brand-btn">Book</a>

                </div>
            </div>
        {% endfor %}

    </div>

{% endblock %}
