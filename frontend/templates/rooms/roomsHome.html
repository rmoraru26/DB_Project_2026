{% extends "layout.html" %}

{% block title %}
    Rooms
{% endblock %}

{% block body %}
    <h1 class="mb-4">Book a Room... or Multiple</h1>

    <div class="row row-cols-1 row-cols-md-3 g-4">
        {% for room in rooms %}
            <div class="col">
                <div class="card">

                    <img src="https://via.placeholder.com/300x150" class="card-img-top" alt="{{ room }} image">

                    <div class="card-body">
                        <h4 class="card-title">{{ room }}</h4>
                    </div>

                    <a href="/rooms/{{ room }}" class="btn btn-lg custom-brand-btn">Book</a>

                </div>
            </div>
        {% endfor %}

    </div>

{% endblock %}
