{% extends "layout.html" %}

{% block title %}
    Book {{ room_name }}
{% endblock %}

{% block body %}
<h1>Book: {{ room_name }}</h1>

<!-- Error Message -->
{% if error %}
  <div class="alert alert-danger">{{ error }}</div>
{% endif %}

<p>Rooms can be booked up to 3 months in advance. Quiet hours: 22:00 - 09:00.</p>

<!-- Booking Form (sends to verify page) -->
<form method="POST" action="{{ url_for('verify_room_booking', room_name=room_name) }}">

  <!-- Date -->
  <label for="date">Date</label>
  <input type="date" id="date" name="date" min="{{ min_date }}" max="{{ max_date }}" required>

  <!-- Time Slot -->
  <label for="time">Time slot</label>
  <select id="time" name="time" required>
    <option value="">Select a time</option>
    {% for slot in slots %}
      <option>{{ slot }}</option>
    {% endfor %}
  </select>

  <!-- Number of People -->
  <label for="people">Number of people</label>
  <input type="number" id="people" name="people" min="1" max="20" required>

  <button type="submit">Continue</button>
</form>

<!-- Weekly Calendar -->
{% include "calendar.html" %}

<!-- Back to Rooms Homepage -->
<div>
  <a href="{{ url_for('rooms_home') }}" class="btn btn-secondary">Back</a>
</div>
{% endblock %}
